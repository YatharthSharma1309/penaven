name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Satisfies Prisma schema validation during build; unit tests do not connect to Postgres.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm run test
        env:
          AUTH_BYPASS: "true"
          NEXT_PUBLIC_AUTH_BYPASS: "true"
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supportai_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Two-workspace integration tests
        run: npm run test:integration
